[package]
name = "forge-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Continuously mirror a GitHub organization to Forgejo, Codeberg, or GitLab"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-forge-sync"
readme = "README.md"
keywords = ["github", "forgejo", "gitlab", "mirror", "migration"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "forge-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
